name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vetpath
          POSTGRES_PASSWORD: vetpath
          POSTGRES_DB: vetpath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetpath -d vetpath_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://vetpath:vetpath@127.0.0.1:5432/vetpath_test
      REAL_PG_TEST_URL: postgresql://vetpath:vetpath@127.0.0.1:5432/vetpath_test
      VETPATH_TEST_DB: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
